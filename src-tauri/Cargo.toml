[package]
name = "snaphost-app"
version.workspace = true
edition.workspace = true
description = "SnapHost - Ultra-fast macOS Hosts & Local Domain Switcher"

[lib]
name = "snaphost_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
snaphost-core = { path = "../crates/snaphost-core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
